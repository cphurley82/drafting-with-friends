{% extends "base.html" %}

{% block content %}
  <form class="form-horizontal" method="post">
  <fieldset>

  <!-- Form Name -->
  <legend>Setup Draft</legend>

  <!-- Text input-->
  <div class="form-group">
    <label class="col-md-4 control-label" for="name">name</label>  
    <div class="col-md-4">
    <input id="name" name="name" type="text" placeholder="" class="form-control input-md" required="" value="{{name}}">
      
    </div>
  </div>

  <!-- Select Basic -->
  <div class="form-group">
    <label class="col-md-4 control-label" for="pack1">pack1</label>
    <div class="col-md-4">
      <select id="pack1" name="pack1" class="form-control">
        {% for key, set in sets.items() %}
          <option value="{{key}}" {% if pack1 == key %}selected{% endif %}>{{key}} - {{set.name}}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- Select Basic -->
  <div class="form-group">
    <label class="col-md-4 control-label" for="pack2">pack2</label>
    <div class="col-md-4">
      <select id="pack2" name="pack2" class="form-control">
        {% for key, set in sets.items() %}
          <option value="{{key}}" {% if pack2 == key %}selected{% endif %}>{{key}} - {{set.name}}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- Select Basic -->
  <div class="form-group">
    <label class="col-md-4 control-label" for="pack2">pack3</label>
    <div class="col-md-4">
      <select id="pack3" name="pack3" class="form-control">
        {% for key, set in sets.items() %}
          <option value="{{key}}" {% if pack3 == key %}selected{% endif %}>{{key}} - {{set.name}}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="form-group">
    <label class="col-md-4 control-label" for="pick_size">Cards picked each turn</label>
    <div class="col-md-4">
      <select id="pick_size" name="pick_size" class="form-control">
        <option value="1" {% if pick_size == 1 %}selected{% endif %}>Pick 1</option>
        <option value="2" {% if pick_size == 2 %}selected{% endif %}>Pick 2</option>
      </select>
    </div>
  </div>

  <div class="error">{{error}}</div>

  <input type="submit">

  </fieldset>
  </form>
{% endblock %}
